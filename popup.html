<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMind Yandex</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #2563eb;
        --blue-soft: #dbeafe;
        --border: rgba(203, 213, 225, 0.78);
        --text: #0f172a;
        --text-2: #334155;
        --muted: #64748b;
        --bg: #eef3fb;
        --surface: rgba(255, 255, 255, 0.72);
        --surface-strong: rgba(255, 255, 255, 0.9);
        --glass-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
        --radius: 14px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 300px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at 50% -90px, rgba(191, 219, 254, 0.65), transparent 62%), var(--bg);
        color: var(--text);
        font-size: 13px;
        padding: 10px;
      }

      .brand {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        backdrop-filter: blur(10px) saturate(1.08);
        -webkit-backdrop-filter: blur(10px) saturate(1.08);
        box-shadow: var(--glass-shadow);

        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px 12px;
        background: var(--surface);

      }

      .brand-logo {
        width: 100%;
        max-width: 160px;
        height: auto;
        filter: var(--qm-logo-filter, none);
        transition: filter 0.25s ease;
      }

      .brand-edition {
        flex: 0 0 auto;
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 999px;
        padding: 3px 7px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
      }

      .status-strip {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        backdrop-filter: blur(10px) saturate(1.08);
        -webkit-backdrop-filter: blur(10px) saturate(1.08);
        box-shadow: var(--glass-shadow);

        padding: 8px 14px 10px;
        background: var(--surface);

        display: grid;
        gap: 8px;
      }

      .balance-line {
        font-size: 14px;
        color: var(--text);
        font-weight: 700;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .quick-section {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        backdrop-filter: blur(10px) saturate(1.08);
        -webkit-backdrop-filter: blur(10px) saturate(1.08);
        box-shadow: var(--glass-shadow);

        padding: 10px 14px;
        background: var(--surface);

        position: relative;
        z-index: 1;
      }

      .quick-title {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .timer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        min-width: 0;
      }

      .timer-label {
        font-size: 11px;
        color: var(--text-2);
        flex-shrink: 0;
        white-space: nowrap;
      }


      .icon-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .widget-icon {
        width: 16px;
        height: 16px;
        min-width: 16px;
        min-height: 16px;
        object-fit: contain;
        display: inline-block;
        flex-shrink: 0;
        filter: var(--qm-icon-filter, none);
        transition: filter 0.2s ease;
      }

      .widget-icon--sm {
        width: 14px;
        height: 14px;
        min-width: 14px;
        min-height: 14px;
      }

      .timer-range {
        flex: 1 1 0;
        min-width: 0;
        accent-color: var(--blue);
        cursor: pointer;
        height: 3px;
        appearance: auto;
      }

      .timer-input-wrap {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 6px;
        padding: 2px 5px;
        gap: 2px;
      }

      .timer-input-wrap:focus-within {
        border-color: #93c5fd;
        box-shadow: 0 0 0 2px #eff6ff;
      }

      .timer-input {
        width: 26px;
        border: none;
        background: transparent;
        font-size: 11px;
        font-weight: 700;
        color: var(--blue);
        font-family: 'SF Mono', 'Fira Code', monospace;
        text-align: center;
        padding: 0;
        outline: none;
        -moz-appearance: textfield;
      }

      .timer-input::-webkit-outer-spin-button,
      .timer-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .timer-unit {
        font-size: 11px;
        font-weight: 700;
        color: var(--blue);
        font-family: 'SF Mono', 'Fira Code', monospace;
        user-select: none;
        line-height: 1;
      }

      .select-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .select-label {
        font-size: 12px;
        font-weight: 600;
      }

      .zone-select {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        flex-shrink: 0;
        min-width: 130px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-2);
        border-radius: 8px;
        font-size: 11px;
        padding: 5px 8px;
        font-family: inherit;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .toggle-row + .toggle-row { margin-top: 8px; }
      .toggle-row.select-wrapper { margin-top: 10px; }

      .model-row {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .model-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-2);
      }

      .model-wrap { position: relative; }

      .model-input {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        width: 100%;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--text-2);
        font-size: 11px;
        padding: 0 10px;
        font-family: inherit;
        outline: none;
      }

      .model-input:focus {
        border-color: #93c5fd;
        box-shadow: 0 0 0 2px #eff6ff;
      }

      .model-list {
        display: none;
        position: absolute;
        top: 35px;
        left: 0;
        right: 0;
        max-height: 180px;
        overflow: auto;
        border: 1px solid #93c5fd;
        border-radius: 8px;
        background: #fff;
        z-index: 20;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25), 0 8px 24px rgba(59, 130, 246, 0.15);
        animation: modelListFadeIn 0.15s ease both;
      }
      @keyframes modelListFadeIn {
        from { opacity: 0; transform: translateY(-4px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .model-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        cursor: pointer;
        border-bottom: 1px solid #f1f5f9;
      }
      .model-item:last-child { border-bottom: none; }
      .model-item:hover { background: #f8fafc; }

      .model-main {
        flex: 1;
        min-width: 0;
      }
      .model-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .model-id {
        font-size: 10px;
        color: var(--muted);
        font-family: monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .model-star {
        border: none;
        background: rgba(255,255,255,0.35);
        font-size: 14px;
        line-height: 1;
        color: #f59e0b;
        cursor: pointer;
        padding: 0 2px;
      }

      .toggle-info .tl { font-size: 12px; font-weight: 600; color: var(--text); }
      .toggle-info .ts { font-size: 10px; color: var(--muted); margin-top: 1px; }

      .toggle {
        position: relative;
        flex-shrink: 0;
        width: 38px;
        height: 22px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: #cbd5e1;
        transition: background 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.22s cubic-bezier(0.34, 1.26, 0.64, 1);
        outline: none;
        box-shadow: inset 0 1px 2px rgba(15,23,42,0.15);
      }

      .toggle::before {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        top: 3px;
        left: 3px;
        /* Spring thumb animation */
        transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.15s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 1px 4px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06);
      }

      .toggle[data-on="true"] {
        background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
        box-shadow: inset 0 1px 1px rgba(22,163,74,0.24), 0 0 0 2px rgba(34,197,94,0.20);
      }
      .toggle[data-on="true"]::before { transform: translateX(16px); }
      .toggle:hover { transform: translateY(-1px) scale(1.04); box-shadow: inset 0 1px 2px rgba(15,23,42,0.12), 0 4px 10px rgba(15,23,42,0.15); }
      .toggle:active { transform: translateY(0) scale(0.97); }
      .toggle:active::before { transform: scaleX(1.22); transform-origin: left center; }
      .toggle[data-on="true"]:active::before { transform: translateX(13px) scaleX(1.22); transform-origin: right center; }
      .toggle:focus-visible { box-shadow: 0 0 0 3px rgba(37,99,235,0.25), inset 0 1px 2px rgba(15,23,42,0.12); }

      .actions {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        backdrop-filter: blur(10px) saturate(1.08);
        -webkit-backdrop-filter: blur(10px) saturate(1.08);
        box-shadow: var(--glass-shadow);

        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--surface);

      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        position: relative;
        overflow: hidden;
        transition:
          filter    0.22s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.28s cubic-bezier(0.34, 1.26, 0.64, 1),
          box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 20px rgba(15,23,42,0.14);
      }
      .btn:active {
        transform: translateY(0) scale(0.96);
        box-shadow: none;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease;
      }
      .btn-secondary {
        background: rgba(255,255,255,0.72);
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: rgba(239, 246, 255, 0.92);
        border-color: #93c5fd;
        color: #1d4ed8;
      }
      .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .btn-row.single { grid-template-columns: 1fr; }

      #statusMsg {
        display: block;
        margin: 6px 14px 0;
        padding: 5px 10px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 500;
        text-align: center;
        line-height: 18px;
        transition: background 0.15s, color 0.15s;
      }

      #statusMsg:empty { display: none; }

      #statusMsg.ok { background: #dcfce7; color: #166534; }
      #statusMsg.err { background: #fee2e2; color: #991b1b; }
      [hidden] { display: none !important; }

      .brand {
        transition: box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .brand:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 30px rgba(15,23,42,0.16);
        border-color: rgba(191, 219, 254, 0.7);
      }
      .brand-logo { transition: transform 0.28s cubic-bezier(0.34, 1.26, 0.64, 1), filter 0.25s ease; }
      .brand:hover .brand-logo { transform: scale(1.02); }

      .status-strip { transition: box-shadow 0.22s ease, border-color 0.22s ease; }
      .quick-section { transition: box-shadow 0.22s ease, border-color 0.22s ease; }
      .actions { transition: box-shadow 0.22s ease, border-color 0.22s ease; }

      /* ─── Balance line animation ─── */
      @keyframes balance-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.2); }
        50%       { box-shadow: 0 0 0 4px rgba(37, 99, 235, 0); }
      }
      .balance-line { transition: background 0.22s ease, box-shadow 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.26, 0.64, 1); }
      .balance-line:hover { transform: scale(1.01); box-shadow: 0 3px 10px rgba(37,99,235,0.12); }

      /* ─── Zone select enhanced ─── */
      .zone-select {
        transition: border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        outline: none;
      }
      .zone-select:hover {
        border-color: #93c5fd;
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(37,99,235,0.10);
      }
      .zone-select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 2.5px rgba(37,99,235,0.20);
        transform: translateY(-1px);
      }

      /* ─── Model input enhanced ─── */
      .model-input {
        transition: border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1), background 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .model-input:hover:not(:focus) {
        border-color: #93c5fd;
        transform: translateY(-1px);
      }
      .model-input:focus {
        border-color: #93c5fd;
        box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18), 0 4px 12px rgba(37,99,235,0.10);
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.99);
      }

      /* ─── Model list item hover enhancement ─── */
      .model-item {
        transition: background 0.16s cubic-bezier(0.22, 1, 0.36, 1), transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), color 0.16s ease;
      }
      .model-item:hover {
        background: #eff6ff;
        transform: translateX(3px);
        color: #1d4ed8;
      }

      /* ─── Timer input wrap enhanced ─── */
      .timer-input-wrap { transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.26, 0.64, 1); }
      .timer-input-wrap:focus-within { border-color: #93c5fd; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); transform: translateY(-1px); }

      /* ─── Toggle row hover ─── */
      .toggle-row { border-radius: 8px; transition: background 0.18s ease; padding: 5px 4px; margin: 0 -4px; }
      .toggle-row:hover { background: rgba(239, 246, 255, 0.6); }

      /* ─── Status message animation ─── */
      @keyframes status-in {
        from { opacity: 0; transform: translateY(-4px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      #statusMsg:not(:empty) { animation: status-in 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img class="brand-logo" src="assets/quizmind-logo.svg" alt="QuizMind Yandex" />
      <span class="brand-edition">Yandex Forms</span>
    </div>

    <div class="status-strip">
      <div class="balance-line" id="balanceLine"><img class="widget-icon widget-icon--sm" src="/assets/widget-icons/account_balance_wallet.svg" alt="" /><span id="balanceText">Balance: ...</span></div>
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="tl icon-label"><img class="widget-icon" src="/assets/widget-icons/mode_off_on.svg" alt="" /><span data-i18n="popup.ext_enabled">Extension Enabled</span></div>
          <div class="ts" data-i18n="popup.ext_enabled_desc">Toggle extension on/off</div>
        </div>
        <button class="toggle" id="toggleExtensionEnabled" type="button" data-on="true"></button>
      </div>
    </div>

    <div class="quick-section">
      <div class="quick-title" data-i18n="popup.quick_settings">Quick settings</div>

      <div class="timer-row">
        <span class="timer-label icon-label"><img class="widget-icon widget-icon--sm" src="/assets/widget-icons/timer.svg" alt="" /><span data-i18n="popup.widget_timer">Widget timer</span></span>
        <input class="timer-range" id="timerRange" type="range" min="1" max="30" step="1" value="5" />
        <div class="timer-input-wrap">
          <input class="timer-input" id="timerInput" type="number" min="1" max="30" step="1" value="5" />
          <span class="timer-unit" data-i18n="popup.seconds_abbr">s</span>
        </div>
      </div>

      <div class="model-row">
        <label class="model-label icon-label" for="modelTextInput"><img class="widget-icon widget-icon--sm" src="/assets/widget-icons/cognition-2.svg" alt="" /><span data-i18n="popup.model_for_text">Model for Text</span></label>
        <div class="model-wrap">
          <input class="model-input" id="modelTextInput" type="text" placeholder="Type or select model" data-i18n-placeholder="popup.model_placeholder" autocomplete="off" />
          <div class="model-list" id="modelTextList"></div>
        </div>
      </div>

      <div class="model-row">
        <label class="model-label icon-label" for="modelVisionInput"><img class="widget-icon widget-icon--sm" src="/assets/widget-icons/cognition-2.svg" alt="" /><span data-i18n="popup.model_for_screenshots">Model for Screenshots</span></label>
        <div class="model-wrap">
          <input class="model-input" id="modelVisionInput" type="text" placeholder="Type or select model" data-i18n-placeholder="popup.model_placeholder" autocomplete="off" />
          <div class="model-list" id="modelVisionList"></div>
        </div>
      </div>

      <div class="toggle-row select-wrapper">
        <label class="select-label icon-label" for="answerZone"><img class="widget-icon" src="/assets/widget-icons/activity-zone.svg" alt="" /><span data-i18n="popup.active_zone">Active screen zone</span></label>
        <select class="zone-select" id="answerZone">
          <option value="left" data-i18n="popup.zone_left">Left</option>
          <option value="right" data-i18n="popup.zone_right">Right</option>
        </select>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <div class="tl icon-label"><img class="widget-icon" src="/assets/widget-icons/search-check-2.svg" alt="" /><span data-i18n="popup.multi_check">Multi Check</span></div>
          <div class="ts" data-i18n="popup.multi_check_desc">Check answer with multiple models</div>
        </div>
        <button class="toggle" id="toggleMultiCheck" type="button" data-on="false"></button>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <div class="tl icon-label"><img class="widget-icon" src="/assets/widget-icons/document-scanner.svg" alt="" /><span data-i18n="popup.quiz_page_scan">Quiz page scan</span></div>
          <div class="ts" data-i18n="popup.quiz_page_scan_desc">Scanning and hover-answers on quiz/review pages</div>
        </div>
        <button class="toggle" id="toggleQuizPageScan" type="button" data-on="false"></button>
      </div>
    </div>

    <div class="actions">
      <div class="btn-row">
        <button class="btn btn-secondary icon-label" id="btnSettings"><img class="widget-icon" src="/assets/widget-icons/settings.svg" alt="" /><span data-i18n="popup.settings_btn">Settings</span></button>
        <button class="btn btn-secondary icon-label" id="btnLogs"><img class="widget-icon" src="/assets/widget-icons/download.svg" alt="" /><span data-i18n="popup.logs_btn">Logs</span> <span id="logsBadge" style="display:none;background:#2563eb;color:#fff;border-radius:999px;padding:1px 6px;font-size:9px;margin-left:3px;"></span></button>
      </div>
    </div>

    <div id="statusMsg"></div>

    <script src="i18n.js"></script>
    <script src="themeEngine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
